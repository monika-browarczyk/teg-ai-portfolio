name: Sprawdzenie środowiska

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_tests:
        description: Uruchom pełne testy ćwiczeń (wymagają zaimplementowanych kroków)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  environment:
    name: Instalacja, składnia i gotowe pomocniki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync python -m compileall -q helpers mini_project_1 mini_project_2 mini_project_3 mini_project_4 mini_project_5
      - name: Testy gotowej konfiguracji i pomocników
        run: >-
          uv run --no-sync pytest -q
          mini_project_1/tests/test_provided_config.py
          mini_project_1/tests/test_provided_llm_notice.py
          mini_project_1/tests/test_provided_prompt.py

  exercises:
    name: Pełne testy ćwiczeń (na żądanie)
    if: github.event_name == 'workflow_dispatch' && inputs.full_tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
